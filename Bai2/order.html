<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feane - Order Online Modal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg">

    <!-- Trang Home ẩn bên dưới làm Nền cho Modal -->
    <nav class="navbar navbar-expand-lg custom-navbar opacity-25">
        <div class="container">
            <a class="navbar-brand font-cursive" href="#">Feane</a>
            <div class="d-flex align-items-center ms-auto">
                <a href="#" class="btn btn-yellow opacity-50">Order Online</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 text-center text-white opacity-25">
        <h1 class="font-cursive display-4">Fast Food Restaurant</h1>
        <img src="https://pngimg.com/uploads/burger/burger_PNG10566.png" style="max-height: 250px;" alt="Burger">
    </div>

    <!-- MODAL ORDER CỐ ĐỊNH HIỂN THỊ 1:1 THEO HÌNH -->
    <div class="modal show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.75);">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 500px;">
            <div class="modal-content border-0 shadow-lg">
                
                <!-- Header -->
                <div class="modal-header border-bottom-0 pb-0 pe-3 pt-3">
                    <h4 class="modal-title font-cursive text-warning fs-3 ms-2">Order</h4>
                    <a href="home.html" class="btn-close border p-1" aria-label="Close" style="font-size: 0.7rem;"></a>
                </div>

                <!-- Body -->
                <div class="modal-body px-4 pt-3 pb-4">
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-medium">Telephone</label>
                            <input type="text" class="form-control border-warning shadow-none py-2" style="border-radius: 12px;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-medium">Email</label>
                            <input type="email" class="form-control border-warning shadow-none py-2" style="border-radius: 12px;">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="checkOut">
                            <label class="form-check-label text-secondary small" for="checkOut">
                                Check me out
                            </label>
                        </div>
                    </form>
                </div>

                <!-- Footer -->
                <div class="modal-footer border-top-0 pt-0 pe-4 pb-4">
                    <button type="button" class="btn btn-warning text-white px-3 py-1 fw-medium" style="background-color: #ffbe33; border: none;">Order</button>
                    <a href="home.html" class="btn btn-warning text-white px-3 py-1 fw-medium" style="background-color: #ffbe33; border: none;">Close</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
