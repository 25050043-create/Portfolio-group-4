<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feane - Book A Table</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container">
            <a class="navbar-brand font-cursive" href="home.html">Feane</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#feaneNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="feaneNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="home.html">HOME</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">MENU</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
                    <li class="nav-item"><a class="nav-link active" href="book.html">BOOK TABLE</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="#" class="nav-icon-link"><i class="fa-solid fa-user"></i></a>
                    <a href="#" class="nav-icon-link"><i class="fa-solid fa-cart-shopping"></i></a>
                    <a href="#" class="nav-icon-link"><i class="fa-solid fa-magnifying-glass"></i></a>
                    <a href="order.html" class="btn btn-yellow ms-2">Order Online</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Book Table Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4 align-items-center">
                <!-- Left Form -->
                <div class="col-md-6">
                    <h2 class="font-cursive display-5 mb-4">Book A Table</h2>
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-custom" placeholder="Your Name">
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control form-control-custom" placeholder="Phone Number">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control form-control-custom" placeholder="Your Email">
                        </div>
                        <div class="mb-3">
                            <select class="form-select form-select-custom text-muted">
                                <option selected>How many persons?</option>
                                <option value="2">2 Persons</option>
                                <option value="3">3 Persons</option>
                                <option value="4">4 Persons</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <input type="date" class="form-control form-control-custom text-muted">
                        </div>
                        <button type="submit" class="btn btn-yellow px-4 py-2 text-uppercase">BOOK NOW</button>
                    </form>
                </div>

                <!-- Right Google Map Placeholder -->
                <div class="col-md-6">
                    <div class="rounded-3 overflow-hidden border shadow-sm" style="height: 350px;">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.4952412123!2d106.699802!3d10.773374!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f40a3b49e59%3A0xa1410f9e160a28f8!2sHo%20Chi%20Minh%20City!5e0!3m2!1sen!2svn!4v1620000000000!5m2!1sen!2svn" 
                            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
